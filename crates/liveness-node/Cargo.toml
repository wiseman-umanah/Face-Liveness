[package]
name = "liveness_node"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.3"
liveness-core = { workspace = true, features = ["vision", "attest"] }
napi-derive = "3.0.0"

[dependencies.napi]
version = "3.0.0"
features = ["napi10"]

[build-dependencies]
napi-build = "2"
