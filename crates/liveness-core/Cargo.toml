[package]
name = "liveness-core"
description = "Core face-liveness logic shared by the Python and Node.js bindings"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["vision", "attest"]
# Face detection + landmarks from raw frames, using bundled ONNX models and pure-Rust inference.
vision = ["dep:tract-onnx", "dep:png"]
# Signed challenge tickets and liveness receipts (Ed25519 JWTs) plus frame hashing.
attest = ["dep:ed25519-dalek", "dep:sha2", "dep:base64", "dep:serde", "dep:serde_json", "dep:getrandom"]

[dependencies]
base64 = { version = "0.23", optional = true }
ed25519-dalek = { version = "3", optional = true }
getrandom = { version = "0.3", optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
thiserror = "2.0.21"
tract-onnx = { version = "0.23.9", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"

[[example]]
name = "analyze_image"
required-features = ["vision"]

[[example]]
name = "video"
required-features = ["vision"]
