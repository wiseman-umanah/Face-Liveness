[package]
name = "liveness-wasm"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
liveness-core = { workspace = true, features = ["vision", "attest"] }
wasm-bindgen = "=0.2.129"

# Browser randomness (crypto.getRandomValues) for challenge seeds and nonces.
# getrandom 0.3 is ours (liveness-core); 0.4 comes in through tract-onnx-opl -> rand.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
