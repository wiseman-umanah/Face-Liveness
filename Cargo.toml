[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/wiseman-umanah/Face-Liveness"
rust-version = "1.88"

[workspace.dependencies]
# Bindings opt into `vision` once they expose it (Phase 3).
liveness-core = { path = "crates/liveness-core", default-features = false }

# Neural-network inference is 10-50x slower unoptimized; keep dependencies fast in dev/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
