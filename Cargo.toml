[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/wiseman-umanah/Face-Liveness"
rust-version = "1.88"

[workspace.dependencies]
liveness-core = { path = "crates/liveness-core" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
